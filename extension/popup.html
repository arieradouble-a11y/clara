<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { margin: 0; padding: 14px; width: 360px; background: #f6f7f9; color: #1a1a1a;
         font: 15px/1.5 system-ui, sans-serif; }
  textarea { width: 100%; min-height: 90px; box-sizing: border-box; font: inherit;
             padding: 8px 10px; border: 1px solid #cbd2d9; border-radius: 8px; resize: vertical; }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  button { border: 0; background: #0f7d74; color: #fff; font: inherit; font-weight: 600;
           padding: 8px 14px; border-radius: 8px; cursor: pointer; }
  button.secondary { background: #fff; color: #0f7d74; border: 1px solid #cbd2d9; }
  button:disabled { opacity: .55; }
  #result { margin-top: 10px; padding: 10px 12px; background: #fff; border: 1px solid #cbd2d9;
            border-radius: 8px; white-space: pre-wrap; font-size: 17px; display: none; }
  #warn { display: none; margin-top: 8px; padding: 6px 10px; border: 1px solid #9a6700;
          border-radius: 8px; background: #fff5e0; color: #9a6700; font-size: 13px; }
  a { color: #0f7d74; font-size: 13px; }
  :focus-visible { outline: 3px solid #0f7d74; outline-offset: 2px; }
</style>
</head>
<body>
  <label for="text" id="lbl"></label>
  <textarea id="text"></textarea>
  <div class="row">
    <button id="go"></button>
    <button id="speak" class="secondary">🔊</button>
    <a href="#" id="opts" style="margin-left:auto; align-self:center"></a>
  </div>
  <div id="result" lang=""></div>
  <p id="warn"></p>
  <script src="popup.js"></script>
</body>
</html>
